name: Deploy examples to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Install Flutter (stable channel with wasm support)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Build your Flutter example app with wasm
      - name: Build Flutter Web (WASM)
        run: |
          cd example
          flutter build web --wasm --release --optimization-level 4

      # Add headers for Cloudflare Pages
      - name: Add COOP/COEP headers
        run: |
          echo '/*\n  Cross-Origin-Opener-Policy: same-origin\n  Cross-Origin-Embedder-Policy: credentialless' > example/build/web/_headers

      # Deploy using Wrangler CLI
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler pages deploy example/build/web --project-name context-plus --branch main